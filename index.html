<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود | زیهو</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>

    <div class="page">
        <div class="brand">
            <div class="brand-container">
                <span class="brand-text">زیبایی به سبک</span>
                <img src="./zeehome.png" alt="زیهوم" class="brand-logo">
            </div>
            <p>متنوع‌ترین کالکشن خانه و آشپزخانه و دکوراسیون</p>
        </div>

        <div class="card">
            <h3>ورود | ثبت نام</h3>
            <p class="hello">درود</p>

            <label>لطفا شماره موبایل خود را وارد کنید</label>
            <div class="input-box error">
                <span class="input-icon">×</span>
                <input type="tel" placeholder="">
            </div>
            <span class="error-text">لطفا این قسمت را خالی نگذارید.</span>

            <button>تایید</button>
            <h5 class="rules">
                با ورود به <span class="rules-red">زی هوم</span>، شما شرایط استفاده و
                <a href="#">قوانین حریم خصوصی</a>
                ما را می‌پذیرید.
            </h5>
        </div>
    </div>
</body>
</html>
